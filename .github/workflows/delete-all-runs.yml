name: Delete All Workflow Runs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب "DELETE" لتأكيد الحذف'
        required: true
        type: string
      dry_run:
        description: 'وضع التجربة (true = عرض فقط بدون حذف)'
        required: false
        type: boolean
        default: false

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write   # مطلوب لحذف الـ runs
      contents: read   # لقراءة الملفات

    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm != 'DELETE'
        run: |
          echo "❌ لم يتم تأكيد الحذف"
          echo "يرجى إعادة تشغيل workflow وكتابة 'DELETE' في حقل التأكيد"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run deletion script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "🔍 وضع التجربة (dry-run) - سيتم العرض فقط"
            python delete_workflow_runs.py --dry-run
          else
            echo "🗑️ بدء الحذف الفعلي..."
            python delete_workflow_runs.py
          fi
