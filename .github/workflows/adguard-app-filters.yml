name: Update AdGuard App Filters

on:
  schedule:
    - cron: '0 */6 * * *'  # كل 6 ساعات
  workflow_dispatch:  # يمكن تشغيله يدوياً

jobs:
  build-adguard-app-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # تم التحديث إلى v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5  # تم التحديث إلى v5
      with:
        python-version: '3.11'  # استخدام إصدار أحدث من Python
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run AdGuard App filter merger
      run: |
        python Adguard_App_filters.py

    - name: List generated files
      run: |
        echo "📁 Generated files:"
        ls -la merged_filters/
        echo ""
        echo "📊 File sizes:"
        du -sh merged_filters/*

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions@github.com"
        
        # إضافة الملفات الجديدة أو المحدثة
        git add merged_filters/
        git add Adguard_App_filters.py
        
        # التحقق من وجود تغييرات
        if git diff --staged --quiet; then
          echo "✅ No changes to commit"
        else
          git commit -m "🔄 Auto-update AdGuard App filters - $(date '+%Y-%m-%d %H:%M:%S')"
          git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          echo "✅ Changes pushed successfully"
        fi

    - name: Upload artifacts (optional)
      if: always()  # سيتم رفع الملفات حتى لو فشلت بعض الخطوات
      uses: actions/upload-artifact@v4  # تم التحديث إلى v4
      with:
        name: adguard-app-filters
        path: merged_filters/
        retention-days: 7
        compression-level: 6  # ضغط أفضل للملفات (اختياري)
        if-no-files-found: warn  # إظهار تحذير إذا لم يتم العثور على ملفات
