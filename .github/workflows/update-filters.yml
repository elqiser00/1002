name: Auto-update AdGuard Android Filters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'list.txt'
      - 'Filters.AdGuard.Android.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: 'merged_filters'

permissions:
  contents: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Verify list.txt
        run: |
          if [ ! -f "list.txt" ]; then
            echo "❌ ملف list.txt غير موجود!"
            exit 1
          fi
          echo "✅ list.txt موجود"
          echo "📋 عدد الروابط: $(grep -c '^http' list.txt || echo 0)"

      - name: Run Filter Merger
        id: merger
        run: |
          echo "🚀 بدء عملية دمج الفلاتر..."
          python Filters.AdGuard.Android.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Verify output
        id: verify
        run: |
          if [ ! -d "${{ env.OUTPUT_DIR }}" ]; then
            echo "❌ مجلد ${{ env.OUTPUT_DIR }} غير موجود!"
            exit 1
          fi

          MAIN_FILE="${{ env.OUTPUT_DIR }}/adguard_android_filter.txt"
          if [ ! -f "$MAIN_FILE" ]; then
            echo "❌ الملف الرئيسي غير موجود!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$MAIN_FILE" 2>/dev/null || stat -f%z "$MAIN_FILE")
          LINE_COUNT=$(wc -l < "$MAIN_FILE")

          echo "✅ الملف الرئيسي موجود"
          echo "📊 الحجم: $(numfmt --to=iec $FILE_SIZE)"
          echo "📊 الأسطر: $LINE_COUNT"

          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "line_count=$LINE_COUNT" >> $GITHUB_OUTPUT

      - name: Read stats
        id: stats
        run: |
          STATS_FILE="${{ env.OUTPUT_DIR }}/stats.json"
          if [ -f "$STATS_FILE" ]; then
            TOTAL=$(python3 -c "import json; print(json.load(open('$STATS_FILE')).get('total_rules', 'unknown'))" 2>/dev/null || echo "unknown")
            BLOCK=$(python3 -c "import json; print(json.load(open('$STATS_FILE')).get('block_rules', 'unknown'))" 2>/dev/null || echo "unknown")
            ALLOW=$(python3 -c "import json; print(json.load(open('$STATS_FILE')).get('allow_rules', 'unknown'))" 2>/dev/null || echo "unknown")
            echo "total_rules=$TOTAL" >> $GITHUB_OUTPUT
            echo "block_rules=$BLOCK" >> $GITHUB_OUTPUT
            echo "allow_rules=$ALLOW" >> $GITHUB_OUTPUT
          else
            echo "total_rules=${{ steps.verify.outputs.line_count }}" >> $GITHUB_OUTPUT
            echo "block_rules=unknown" >> $GITHUB_OUTPUT
            echo "allow_rules=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add only the output directory (faster than git add -A)
          git add ${{ env.OUTPUT_DIR }}/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "✅ لا يوجد تغييرات جديدة"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTAL="${{ steps.stats.outputs.total_rules }}"
          BLOCK="${{ steps.stats.outputs.block_rules }}"
          ALLOW="${{ steps.stats.outputs.allow_rules }}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Commit with --no-verify to skip hooks
          git commit --no-verify -m "🔄 Auto-update: ${TOTAL} rules (${BLOCK} block, ${ALLOW} allow) | ${DATE}"

          # Push with retry
          for i in 1 2 3; do
            if git push "https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"; then
              echo "✅ تم الرفع بنجاح!"
              echo "changed=true" >> $GITHUB_OUTPUT
              break
            else
              echo "⚠️ محاولة الرفع $i فشلت، إعادة المحاولة..."
              git pull --rebase "https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git" "${{ github.ref_name }}" || true
              sleep 3
            fi
          done

      - name: Job Summary
        if: always()
        run: |
          echo "## 📊 Filters.AdGuard.Android - نتيجة التشغيل" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| المقياس | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ الوقت | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 الملف الرئيسي | adguard_android_filter.txt |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 إجمالي القواعد | ${{ steps.stats.outputs.total_rules }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚫 قواعد الحظر | ${{ steps.stats.outputs.block_rules }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ قواعد الاستثناء | ${{ steps.stats.outputs.allow_rules }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📏 عدد الأسطر | ${{ steps.verify.outputs.line_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 تم التغيير | ${{ steps.commit.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 [عرض الملفات](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/merged_filters)" >> $GITHUB_STEP_SUMMARY
