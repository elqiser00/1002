name: Combine AdGuard Filters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  combine_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 1

    - name: Disable sparse-checkout if active
      run: git sparse-checkout disable || echo "Sparse checkout not active"

    - name: Remove only the output files of this script (keep other files)
      run: |
        # حذف الملفات التي ينتجها هذا السكريبت فقط (final_filters_part*.txt)
        rm -f merged_filters/final_filters_part*.txt
        echo "Removed old part files from merged_filters/"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run combine script
      run: python combine_filters.py

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        
        # تأكد من إلغاء sparse-checkout
        git sparse-checkout disable 2>/dev/null || true
        
        # إضافة التغييرات (سيتم إضافة الملفات الجديدة فقط)
        git add -A
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "🔄 Auto-update combined filters"
        git pull --rebase origin main --strategy-option=ours
        git push origin HEAD:main
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
