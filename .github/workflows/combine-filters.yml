name: Combine AdGuard Filters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  combine_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository (shallow + sparse)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 1               # سحب آخر commit فقط
        sparse-checkout: |
          !merged_filters            # استبعاد مجلد المخرجات القديم (إن وجد)
          .github/workflows/*.yml
          combine_filters.py
          list.txt
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run combine script
      run: python combine_filters.py

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "🔄 Auto-update combined filters"
        git pull --rebase https://${{ secrets.GH_TOKEN }}@github.com/elqiser00/1002.git main
        git push https://${{ secrets.GH_TOKEN }}@github.com/elqiser00/1002.git HEAD:main
