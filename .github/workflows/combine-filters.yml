name: Combine AdGuard Filters

on:
  schedule:
    - cron: '0 */6 * * *'     # كل 6 ساعات
  workflow_dispatch:           # تشغيل يدوي

jobs:
  combine_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository (latest commit only)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 1          # سحب آخر commit فقط لتقليل البيانات

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run combine script
      run: python combine_filters.py

    - name: Check file sizes (avoid GitHub limits)
      run: |
        echo "📦 Generated files in merged_filters/:"
        if [ -d "merged_filters" ]; then
          ls -lh merged_filters/
          echo "---------------------------------"
          for file in merged_filters/*.txt; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              size_mb=$((size / 1048576))
              echo "🔍 $file: $size_mb MB"
              if [ $size_mb -gt 95 ]; then
                echo "⚠️ Warning: $file exceeds 95 MB, push may fail!"
              fi
            fi
          done
        else
          echo "merged_filters/ directory not found"
        fi

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add -A
        # Only commit if there are changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🔄 Auto-update combined filters"
          # Push directly (no pull needed because we use fetch-depth=1 and no concurrent pushes expected)
          git push https://${{ secrets.GH_TOKEN }}@github.com/elqiser00/1002.git HEAD:main
        fi
