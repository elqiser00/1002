name: Build Adguard Adblock only

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "list2.txt"
      - "build.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --upgrade requests

      - name: Clean old outputs
        run: |
          rm -f "Adguard-Adblock-only"/*.txt || true
          rm -f "Adguard-Adblock-only/0" || true

      - name: Build
        run: python build.py

      - name: Debug - list files
        run: |
          echo "=== محتويات الفولدر ==="
          ls -la "Adguard-Adblock-only" || echo "الفولدر مش موجود!"
          echo "=== عدد الملفات ==="
          find "Adguard-Adblock-only" -type f | wc -l

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d "Adguard-Adblock-only" ] || [ -z "$(ls -A "Adguard-Adblock-only" 2>/dev/null | grep -v '^0$')" ]; then
            echo "❌ الفولدر فاضي أو مش موجود"
            exit 1
          fi

          git add -A "Adguard-Adblock-only"
          git status

          if git diff --staged --quiet; then
            echo "✅ مفيش تغييرات"
          else
            git commit -m "chore: update blacklist [skip ci]"
            git push
          fi
