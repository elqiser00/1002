name: Build Adguard Adblock only

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "list2.txt"
      - "build.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --upgrade requests

      - name: Clean old outputs
        run: |
          rm -f "Adguard-Adblock-only"/*.txt || true
          rm -f "Adguard-Adblock-only/0" || true

      - name: Build (Deep Scan)
        run: python build.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d "Adguard-Adblock-only" ]; then
            echo "❌ الفولدر مش موجود"
            exit 1
          fi

          git add -A "Adguard-Adblock-only"

          if git diff --staged --quiet; then
            echo "✅ مفيش تغييرات"
            exit 0
          fi

          git commit -m "chore: update blacklist [skip ci]"

          # 🔑 سحب التغييرات البعيدة + rebase
          git pull --rebase origin main

          # حل التعارض لو حصل: ناخد نسختنا
          git checkout --ours "Adguard-Adblock-only/blacklist.txt" 2>/dev/null || true
          git add -A "Adguard-Adblock-only" 2>/dev/null || true
          git rebase --continue 2>/dev/null || true

          # الرفع
          git push origin main
