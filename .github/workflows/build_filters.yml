name: Build Zero Filters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'list.txt'
      - 'filter_processor.py'
      - '.github/workflows/build_filters.yml'

concurrency:
  group: build-filters
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # جلب آخر commit فقط لتسريع العملية
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Filter Processor
        run: python filter_processor.py
        
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add zero/
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "♻️ Auto-update Zero filters $(date +%Y%m%d%H%M)"
            
            # استخدام rebase مع shallow history
            git pull --rebase origin main --allow-unrelated-histories || {
              echo "⚠️ Rebase conflict, forcing update..."
              git rebase --abort
            }
            
            # الدفع مع السماح بالتجاوز الآمن
            git push origin main --force-with-lease
          fi
