name: Auto-update merged filters

on:
  schedule:
    - cron: '0 */6 * * *'  # كل 6 ساعات عند الدقيقة 0
  workflow_dispatch:  # التشغيل اليدوي

jobs:
  merge_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # حد زمني للمهمة

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0  # جلب كل تاريخ الكوميتس

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # تحديد إصدار بايثون
        cache: 'pip'  # تفعيل الكاش

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Run merge script with cleaning
      run: |
        python merge_filters.py --clean --exact-duplicates

    - name: Commit and push changes
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "🧹 Merged filters [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
        git pull --rebase  # تجنب التعارضات
        git push
