name: Auto-update merged filters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  merge_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Set up Python (skip dependency installation)
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: ''  # تعطيل البحث عن ملفات المتطلبات

    - name: Install required packages
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Run merge script
      run: |
        python merge_filters.py

    - name: Commit and push changes
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "🔄 Auto-update merged filters [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes to commit"
        git pull --rebase
        git push
