name: تحديث قائمة حظر dnsmasq

on:
  schedule:
    - cron: '0 0 * * *'   # كل 24 ساعة (منتصف الليل UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: سحب الكود
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: إعداد بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: تثبيت المكتبات
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: تشغيل السكربت
      run: python process_lists.py

    - name: حفظ الملف المضغوط في المجلد
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dnsmasq_filters/dnsmasq_blocklist.conf.gz
        if ! git diff --staged --quiet; then
          git commit -m "تحديث تلقائي لقائمة dnsmasq - $(date +'%Y-%m-%d')"
          git push
        else
          echo "لا توجد تغييرات."
        fi

    - name: الحصول على التاريخ للتاج
      id: date
      run: echo "tag=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

    - name: إنشاء Release (اختياري لكن مفيد)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: blocklist-${{ steps.date.outputs.tag }}-${{ github.run_number }}
        name: "قائمة الحظر - ${{ steps.date.outputs.tag }}"
        body: |
          تحديث تلقائي لقائمة dnsmasq.
          الملف داخل المستودع: `dnsmasq_filters/dnsmasq_blocklist.conf.gz`
        files: dnsmasq_filters/dnsmasq_blocklist.conf.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: حذف الإصدارات القديمة (احتفظ بآخر 5)
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
