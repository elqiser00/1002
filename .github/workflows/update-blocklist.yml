name: تحديث قائمة حظر dnsmasq

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # ====== 1. سحب الكود ======
    - name: سحب كود المستودع
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        show-progress: false
      timeout-minutes: 5

    # ====== 2. إعداد بايثون ======
    - name: إعداد بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # ====== 3. تثبيت المكتبات ======
    - name: تثبيت المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir \
          requests \
          urllib3 \
          certifi \
          httpx \
          h2 \
          brotli \
          chardet \
          charset-normalizer
      timeout-minutes: 5

    # ====== 4. التحقق من curl ======
    - name: التحقق من curl
      run: |
        curl --version || sudo apt-get install -y curl
        echo "✅ curl جاهز"

    # ====== 5. تشغيل السكربت ======
    - name: تشغيل سكربت معالجة القوائم
      run: python process_lists.py
      timeout-minutes: 45

    # ====== 6. التحقق من الملف الناتج ======
    - name: التحقق من الملف الناتج
      run: |
        if [ -f "dnsmasq_filters/dnsmasq_blocklist.conf.gz" ]; then
          echo "✅ الملف موجود"
          ls -lh dnsmasq_filters/
          echo "📊 عدد الأسطر:"
          gunzip -c dnsmasq_filters/dnsmasq_blocklist.conf.gz | wc -l
        else
          echo "❌ الملف غير موجود!"
          exit 1
        fi

    # ====== 7. حفظ الملف مع حل تعارض push ======
    - name: حفظ الملف المضغوط في المستودع
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dnsmasq_filters/dnsmasq_blocklist.conf.gz dnsmasq_filters/skipped_lines.log
        
        if git diff --staged --quiet; then
          echo "ℹ️ لا توجد تغييرات جديدة"
          exit 0
        fi
        
        git commit -m "🔄 تحديث تلقائي لقائمة dnsmasq - $(date +'%Y-%m-%d %H:%M UTC')"
        
        # إعادة المحاولة عند فشل push (بسبب commits جديدة من تشغيل آخر)
        MAX_RETRIES=5
        RETRY=0
        until git push; do
          RETRY=$((RETRY + 1))
          if [ $RETRY -ge $MAX_RETRIES ]; then
            echo "❌ فشل push بعد $MAX_RETRIES محاولات"
            exit 1
          fi
          echo "⚠️ محاولة $RETRY: فشل push، جاري مزامنة التغييرات..."
          git pull --rebase origin main
          sleep 3
        done
        echo "✅ تم الحفظ في المستودع"
      timeout-minutes: 10

    # ====== 8. الحصول على التاريخ ======
    - name: الحصول على التاريخ الحالي
      id: date
      run: echo "tag=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

    # ====== 9. إنشاء Release ======
    - name: إنشاء إصدار جديد ورفع الملف
      uses: softprops/action-gh-release@v2
      with:
        tag_name: blocklist-${{ steps.date.outputs.tag }}-${{ github.run_number }}
        name: "قائمة الحظر - ${{ steps.date.outputs.tag }}"
        body: |
          ## 🛡️ تحديث تلقائي لقائمة حظر dnsmasq

          **التاريخ:** ${{ steps.date.outputs.tag }}  
          **رقم التشغيل:** #${{ github.run_number }}

          ### 📦 الملفات المرفقة
          - `dnsmasq_blocklist.conf.gz` — قائمة الحظر بصيغة dnsmasq مضغوطة

          ### 🔗 روابط التنزيل
          - **آخر إصدار دائمًا:** [اضغط هنا](https://github.com/${{ github.repository }}/releases/latest/download/dnsmasq_blocklist.conf.gz)
          - **من المستودع مباشرة:** [اضغط هنا](https://github.com/${{ github.repository }}/raw/main/dnsmasq_filters/dnsmasq_blocklist.conf.gz)

          ### 💻 طريقة الاستخدام
          ```bash
          # تنزيل
          wget https://github.com/${{ github.repository }}/releases/latest/download/dnsmasq_blocklist.conf.gz

          # فك الضغط
          gunzip dnsmasq_blocklist.conf.gz

          # النسخ لمجلد dnsmasq
          sudo mv dnsmasq_blocklist.conf /etc/dnsmasq.d/

          # إعادة التشغيل
          sudo systemctl restart dnsmasq
