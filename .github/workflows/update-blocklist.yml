name: تحديث قائمة حظر dnsmasq

on:
  schedule:
    # كل يوم الساعة 12 منتصف الليل UTC (3 صباحًا بتوقيت القاهرة)
    - cron: '0 0 * * *'
  workflow_dispatch:  # يسمح بالتشغيل اليدوي

# صلاحيات مطلوبة لإنشاء Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: سحب كود المستودع
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: إعداد بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: تثبيت المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: تشغيل سكربت معالجة القوائم
      run: python process_lists.py

    - name: الحصول على التاريخ الحالي للتاج
      id: date
      run: echo "tag=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

    - name: إنشاء إصدار جديد ورفع الملف المضغوط
      uses: softprops/action-gh-release@v2
      with:
        tag_name: blocklist-${{ steps.date.outputs.tag }}-${{ github.run_number }}
        name: "قائمة الحظر - ${{ steps.date.outputs.tag }}"
        body: |
          تحديث تلقائي لقائمة حظر dnsmasq
          - التاريخ: ${{ steps.date.outputs.tag }}
          - الملف المضغوط: `dnsmasq_blocklist.conf.gz`
          - لفك الضغط: `gunzip dnsmasq_blocklist.conf.gz`
        files: dnsmasq_blocklist.conf.gz
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: حذف الإصدارات القديمة (الاحتفاظ بآخر 5 فقط)
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
