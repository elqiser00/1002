name: تحديث قائمة حظر dnsmasq

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dnsmasq-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: سحب كود المستودع
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        fetch-tags: false
        show-progress: false
      timeout-minutes: 5

    - name: إعداد بايثون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: تثبيت المكتبات
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir \
          requests urllib3 certifi httpx h2 brotli chardet charset-normalizer
      timeout-minutes: 5

    - name: التحقق من curl
      run: |
        curl --version || sudo apt-get install -y curl
        echo "✅ curl جاهز"

    - name: تشغيل السكربت
      run: python process_lists.py
      timeout-minutes: 45

    - name: التحقق من الملف الناتج
      run: |
        if [ -f "dnsmasq_filters/dnsmasq_blocklist.conf.gz" ]; then
          echo "✅ الملف موجود"
          ls -lh dnsmasq_filters/
          echo "📊 عدد الأسطر:"
          gunzip -c dnsmasq_filters/dnsmasq_blocklist.conf.gz | wc -l
        else
          echo "❌ الملف غير موجود!"
          exit 1
        fi

    # ====== حفظ الملفات مع حل قوي لتعارض push ======
    - name: حفظ الملفات في المستودع
      run: |
        # 1. احفظ الملفات الناتجة في مكان آمن
        mkdir -p /tmp/generated
        cp dnsmasq_filters/dnsmasq_blocklist.conf.gz /tmp/generated/ 2>/dev/null || true
        cp dnsmasq_filters/skipped_lines.log /tmp/generated/ 2>/dev/null || true
        cp dnsmasq_filters/stats.txt /tmp/generated/ 2>/dev/null || true

        # 2. إعداد git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 3. مزامنة كاملة مع remote (بدون depth لتجنب مشاكل rebase)
        git fetch origin main
        git reset --hard origin/main

        # 4. أعد نسخ الملفات الناتجة
        mkdir -p dnsmasq_filters
        cp /tmp/generated/* dnsmasq_filters/ 2>/dev/null || true

        # 5. أضف وتحقّق من وجود تغييرات
        git add dnsmasq_filters/
        if git diff --staged --quiet; then
          echo "ℹ️ لا توجد تغييرات جديدة"
          exit 0
        fi

        # 6. commit و push
        git commit -m "🔄 تحديث تلقائي لقائمة dnsmasq - $(date +'%Y-%m-%d %H:%M UTC')"

        # 7. محاولة push مع retry بسيط
        MAX_RETRIES=3
        RETRY=0
        until git push origin HEAD:main; do
          RETRY=$((RETRY + 1))
          if [ $RETRY -ge $MAX_RETRIES ]; then
            echo "❌ فشل push بعد $MAX_RETRIES محاولات"
            exit 1
          fi
          echo "⚠️ محاولة $RETRY..."
          sleep 5
          # أعد المزامنة والأخذ بأحدث نسخة
          git fetch origin main
          git rebase origin/main || {
            # لو فشل rebase، ارجع للطريقة القوية
            cp dnsmasq_filters/dnsmasq_blocklist.conf.gz /tmp/generated/ 2>/dev/null || true
            cp dnsmasq_filters/skipped_lines.log /tmp/generated/ 2>/dev/null || true
            cp dnsmasq_filters/stats.txt /tmp/generated/ 2>/dev/null || true
            git rebase --abort || true
            git reset --hard origin/main
            mkdir -p dnsmasq_filters
            cp /tmp/generated/* dnsmasq_filters/ 2>/dev/null || true
            git add dnsmasq_filters/
            git commit -m "🔄 تحديث تلقائي - محاولة $RETRY - $(date +'%Y-%m-%d %H:%M UTC')" || true
          }
        done
        echo "✅ تم الحفظ في المستودع"
      timeout-minutes: 10

    - name: الحصول على التاريخ
      id: date
      run: echo "tag=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

    - name: إنشاء Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: blocklist-${{ steps.date.outputs.tag }}-${{ github.run_number }}
        name: "قائمة الحظر - ${{ steps.date.outputs.tag }}"
        body: |
          ## 🛡️ تحديث تلقائي لقائمة حظر dnsmasq

          **التاريخ:** ${{ steps.date.outputs.tag }}  
          **رقم التشغيل:** #${{ github.run_number }}

          ### 📦 الملفات المرفقة
          - `dnsmasq_blocklist.conf.gz` — القائمة النهائية (بعد إزالة الفروع المكررة)

          ### 🔗 روابط التنزيل
          - **آخر إصدار:** [اضغط هنا](https://github.com/${{ github.repository }}/releases/latest/download/dnsmasq_blocklist.conf.gz)
          - **من المستودع:** [اضغط هنا](https://github.com/${{ github.repository }}/raw/main/dnsmasq_filters/dnsmasq_blocklist.conf.gz)

          ### 💻 الاستخدام
          ```bash
          wget https://github.com/${{ github.repository }}/releases/latest/download/dnsmasq_blocklist.conf.gz
          gunzip dnsmasq_blocklist.conf.gz
          sudo mv dnsmasq_blocklist.conf /etc/dnsmasq.d/
          sudo systemctl restart dnsmasq
