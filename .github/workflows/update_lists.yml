name: Update AdGuard Lists

on:
  schedule:
    # تشغيل كل 6 ساعات (يمكنك تعديل التوقيت)
    - cron: '0 */6 * * *'
  workflow_dispatch: # لتشغيله يدوياً أيضاً

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run Aggregator Script
      run: |
        python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add zero/
        # التحقق من وجود تغييرات قبل ال-commit
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update: Filter lists updated in zero/"
          git push
        else
          echo "No changes to commit."
        fi
