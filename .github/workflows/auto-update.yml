name: Auto-update Pi-hole filters

on:
  schedule:
    - cron: '0 */6 * * *'  # كل 6 ساعات
  workflow_dispatch:

jobs:
  merge_filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Pi-hole merge script
      run: |
        python pi-hole_filter_merger.py

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "github-actions@github.com"
        git add -A
        git commit -m "🔄 Auto-update Pi-hole filters" || echo "Nothing to commit"
        git push https://${{ secrets.GH_TOKEN }}@github.com/elqiser00/1002.git HEAD:main
