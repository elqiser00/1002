name: Auto-update AdGuard Android Filters

on:
  schedule:
    - cron: '0 */6 * * *'    # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'list.txt'
      - 'Filters.AdGuard.Android.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: 'merged_filters'

permissions:
  contents: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Verify list.txt
        run: |
          if [ ! -f "list.txt" ]; then
            echo "❌ ملف list.txt غير موجود!"
            exit 1
          fi
          URL_COUNT=$(grep -cE '^https?://' list.txt || echo 0)
          echo "✅ list.txt موجود | 📋 عدد الروابط: $URL_COUNT"

      - name: Run Filter Merger
        id: merger
        run: |
          echo "🚀 بدء عملية دمج الفلاتر..."
          python Filters.AdGuard.Android.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Verify output format
        id: verify
        run: |
          if [ ! -d "${{ env.OUTPUT_DIR }}" ]; then
            echo "❌ مجلد ${{ env.OUTPUT_DIR }} غير موجود!"
            exit 1
          fi

          MAIN_FILE="${{ env.OUTPUT_DIR }}/adguard_android_filter.txt"
          if [ ! -f "$MAIN_FILE" ]; then
            echo "❌ الملف الرئيسي غير موجود!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$MAIN_FILE" 2>/dev/null || stat -f%z "$MAIN_FILE")
          LINE_COUNT=$(wc -l < "$MAIN_FILE")
          BLOCK_COUNT=$(grep -cE '^\|\|' "$MAIN_FILE" || true)
          ALLOW_COUNT=$(grep -cE '^@@\|\|' "$MAIN_FILE" || true)

          echo "✅ الملف الرئيسي موجود"
          echo "📊 الحجم: $(numfmt --to=iec $FILE_SIZE)"
          echo "📊 الأسطر: $LINE_COUNT"
          echo "🚫 حظر: $BLOCK_COUNT | ⚪ سماح: $ALLOW_COUNT"

          # ─── CRITICAL CHECKS for AdGuard Android compatibility ───
          echo "🔍 فحص صحة الصيغة..."

          # 1. Header must have [Adblock Plus 2.0]
          if ! head -1 "$MAIN_FILE" | grep -q '\[Adblock Plus 2.0\]'; then
            echo "❌ خطأ: الـ Header مفيش [Adblock Plus 2.0]"
            exit 1
          fi
          echo "   ✅ Header صحيح [Adblock Plus 2.0]"

          # 2. NO $important modifier (AdGuard Home only)
          IMPORTANT_COUNT=$(grep -c '\$important' "$MAIN_FILE" || true)
          if [ "$IMPORTANT_COUNT" -gt 0 ]; then
            echo "❌ خطأ: وجدت $IMPORTANT_COUNT قاعدة بـ \$important — ده لـ AdGuard Home مش Android"
            echo "   مثال: $(grep -m1 '\$important' "$MAIN_FILE" || true)"
            exit 1
          fi
          echo "   ✅ مفيش \$important (Android compatible)"

          # 3. Block rules must use || (double pipe)
          SINGLE_PIPE_BLOCK=$(grep -cE '^\|[a-zA-Z0-9]' "$MAIN_FILE" || true)
          if [ "$SINGLE_PIPE_BLOCK" -gt 0 ]; then
            echo "❌ خطأ: وجدت $SINGLE_PIPE_BLOCK قاعدة حظر بصيغة |domain^ (pipe واحد) - المفروض ||domain^"
            echo "   مثال: $(grep -m1E '^\|[a-zA-Z0-9]' "$MAIN_FILE" || true)"
            exit 1
          fi
          echo "   ✅ كل الحظر بـ || (double pipe)"

          # 4. Allow rules must use @@|| (double pipe)
          SINGLE_PIPE_ALLOW=$(grep -cE '^@@\|[a-zA-Z0-9]' "$MAIN_FILE" || true)
          if [ "$SINGLE_PIPE_ALLOW" -gt 0 ]; then
            echo "❌ خطأ: وجدت $SINGLE_PIPE_ALLOW قاعدة سماح بصيغة @@|domain^ - المفروض @@||domain^"
            echo "   مثال: $(grep -m1E '^@@\|[a-zA-Z0-9]' "$MAIN_FILE" || true)"
            exit 1
          fi
          echo "   ✅ كل الاستثناءات بـ @@|| (double pipe)"

          # 5. Check for duplicate domains (basic check)
          DUP_DOMAINS=$(grep -oE '^\|\|[^\^]+' "$MAIN_FILE" | sort | uniq -d | wc -l)
          if [ "$DUP_DOMAINS" -gt 0 ]; then
            echo "⚠️  تحذير: وجدت $DUP_DOMAINS دومين متكرر في قواعد الحظر"
          else
            echo "   ✅ مفيش دومينات متكررة"
          fi

          # 6. Sample output
          echo "   📋 عينة من القواعد:"
          grep -m3 '^||' "$MAIN_FILE" | while read rule; do
            echo "      🚫 $rule"
          done
          grep -m3 '^@@||' "$MAIN_FILE" | while read rule; do
            echo "      ⚪ $rule"
          done

          # Export outputs
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "line_count=$LINE_COUNT" >> $GITHUB_OUTPUT
          echo "block_count=$BLOCK_COUNT" >> $GITHUB_OUTPUT
          echo "allow_count=$ALLOW_COUNT" >> $GITHUB_OUTPUT
          echo "important_count=$IMPORTANT_COUNT" >> $GITHUB_OUTPUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add merged_filters/adguard_android_filter.txt

          if git diff --cached --quiet; then
            echo "✅ لا يوجد تغييرات جديدة"
            exit 0
          fi

          git commit -m "🔄 Auto-update filters $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Job Summary
        if: always()
        run: |
          echo "## 📊 Filters.AdGuard.Android — نتيجة التشغيل" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| المقياس | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ⏰ الوقت | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 الملف | adguard_android_filter.txt |" >> $GITHUB_STEP_SUMMARY
          echo "| 📏 عدد الأسطر | ${{ steps.verify.outputs.line_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 حجم الملف | $(numfmt --to=iec ${{ steps.verify.outputs.file_size }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚫 قواعد الحظر | ${{ steps.verify.outputs.block_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ قواعد الاستثناء | ${{ steps.verify.outputs.allow_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚫 \$important (0=OK) | ${{ steps.verify.outputs.important_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 [عرض الملف](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/merged_filters)" >> $GITHUB_STEP_SUMMARY
